name: build AppImage

on:
  push:
    branches: [master]
    tags: ["v*"]
    paths:
      - "cmd/zen-gate/**"
      - "internal/**"
      - "tools/build-linux.sh"
      - "assets/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/build-appimage.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libayatana-appindicator3-dev

      - name: Compute version
        id: ver
        run: |
          if [ "${GITHUB_REF_NAME:0:1}" = "v" ]; then
            echo "version=$(echo $GITHUB_REF_NAME | sed s/^v//)" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build AppImage
        run: tools/build-linux.sh "${{ steps.ver.outputs.version }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: zen-gate-appimage
          path: dist/*.AppImage
          retention-days: 30

      - name: Publish to Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.ref_name }}"
          assets=$(ls dist/*.AppImage)
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" $assets --clobber
            gh release edit "$tag" --latest
          else
            gh release create "$tag" $assets --title "$tag" --generate-notes --latest
          fi
